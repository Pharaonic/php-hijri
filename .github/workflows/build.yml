name: Build

on:
  push:
    branches:
      - '8.*.x'

  pull_request:
    branches:
      - '8.*.x'

jobs:
  build:
    name: PHP ${{ matrix.php }} - ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve PHP version
        id: php
        shell: bash
        run: |
          BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          PHP_VERSION="${BRANCH%.x}"

          echo "branch=${BRANCH}"
          echo "version=${PHP_VERSION}"

          echo "version=${PHP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php.outputs.version }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: composer test