name: Bug report
description: Report something that is not working as expected.
labels: [bug]
body:
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: '8.0.0'
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: '8.0'
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'Ubuntu 20.04'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal code or steps that reproduce the problem.
      render: php
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages and stack traces if any.
    validations:
      required: true
